name: Generate Dashboard Snapshot

on:
  schedule:
    - cron: '*/5 * * * *'   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run snapshot generator
        run: python generate_snapshot.py

      - name: Commit and push (always)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Snapshot update $(date -u +'%Y-%m-%d %H:%M UTC')" && git push
